<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b25" />
      <stop offset="50%" stop-color="#0f131c" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6" />
      <stop offset="100%" stop-color="#4edea3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer ambient glow circle -->
  <circle cx="256" cy="256" r="160" fill="#4f46e5" opacity="0.18" filter="url(#glow)" />

  <!-- Shield / Card container behind cap -->
  <rect x="116" y="116" width="280" height="280" rx="44" fill="#1c1f29" stroke="#464555" stroke-width="3" stroke-opacity="0.5" />

  <!-- Academic Mortarboard Graduation Cap -->
  <!-- Top diamond shape -->
  <polygon points="256,160 380,220 256,280 132,220" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Under skull cap -->
  <path d="M180,245 L180,296 C180,332 332,332 332,296 L332,245 C308,260 282,268 256,268 C230,268 204,260 180,245 Z" fill="#3730a3" />

  <!-- Tassel ribbon & bead -->
  <path d="M352,225 L368,285 L360,295 L376,295 L368,285" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="368" cy="295" r="8" fill="#4cd7f6" />

  <!-- Accent stars / nodes (Project Hub motif) -->
  <circle cx="160" cy="350" r="5" fill="#4edea3" />
  <circle cx="256" cy="365" r="7" fill="#4cd7f6" />
  <circle cx="352" cy="350" r="5" fill="#c3c0ff" />
  <line x1="160" y1="350" x2="256" y2="365" stroke="#464555" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="256" y1="365" x2="352" y2="350" stroke="#464555" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Subtle App Label -->
  <text x="256" y="440" font-family="'Geist', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#dfe2ef" text-anchor="middle" letter-spacing="2">PROJECT HUB</text>
</svg>
